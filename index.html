<!DOCTYPE html>
<html>
<head>
    <title>For Prerna ❤️</title>
    <style>
        body {
            text-align: center;
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ffd6e0, #ffeef2);
            margin-top: 120px;
        }

        h1 {
            font-size: 35px;
            color: #8b004f;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        #yesBtn {
            background-color: #c9184a;
            color: white;
        }

        #noBtn {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>

<body>

<h1 id="question">
Prerna, will you be mine in 2026? ❤️
</h1>

<button id="yesBtn" onclick="location.href='yes.html'">Yes ❤️</button>
<button id="noBtn" onclick="handleNo()">No 😢</button>

<script>
    let noCount = 0;
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const question = document.getElementById("question");

    const messages = [
        "Are you sure? 🥺",
        "Think again… carefully 😌",
        "I'll bring coffee forever ☕",
        "I’ll listen to all your stories.",
        "Even the long ones. Promise.",
        "Okay this is getting serious.",
        "You’re enjoying this, aren’t you?",
        "Last chance before I get dramatic 😭"
    ];

    function handleNo() {
        if (noCount < messages.length) {
            question.innerText = messages[noCount];
        } else {
            question.innerText = "Fine. The Yes button is clearly better anyway 😌";
        }

        noCount++;

        // Make yes bigger
        let currentSize = window.getComputedStyle(yesBtn).fontSize;
        let newSize = parseFloat(currentSize) + 5;
        yesBtn.style.fontSize = newSize + "px";

        // Make no smaller
        let noSize = window.getComputedStyle(noBtn).fontSize;
        let smallerSize = parseFloat(noSize) - 2;
        if (smallerSize > 8) {
            noBtn.style.fontSize = smallerSize + "px";
        }
    }
</script>

</body>
</html>
